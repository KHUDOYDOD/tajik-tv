<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🇹🇯 Таджикское ТВ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--tg-theme-bg-color, #0f0f0f);
    color: var(--tg-theme-text-color, #fff);
    min-height: 100vh;
  }

  /* Заголовок */
  .header {
    background: linear-gradient(135deg, #c41e3a, #8b0000);
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 15px rgba(0,0,0,0.5);
  }
  .header-flag { font-size: 28px; }
  .header-title { font-size: 18px; font-weight: 700; }
  .header-sub { font-size: 12px; opacity: 0.8; }

  /* Плеер */
  #player-section {
    display: none;
    background: #000;
    position: relative;
  }
  #player-section.active { display: block; }
  #video-player {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
  }
  .player-info {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .player-name { font-size: 16px; font-weight: 600; }
  .player-live {
    background: #c41e3a;
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .close-player {
    background: rgba(255,255,255,0.1);
    border: none;
    color: white;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }

  /* Список каналов */
  .channels-section { padding: 12px; }
  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 8px 0 10px 4px;
  }
  .channels-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .channel-card {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 14px 12px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    overflow: hidden;
  }
  .channel-card:active { transform: scale(0.97); }
  .channel-card.playing {
    border-color: #c41e3a;
    background: linear-gradient(135deg, #2a0a10, #1a0508);
  }
  .channel-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, #c41e3a, #ff6b6b);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .channel-card.playing::before { opacity: 1; }

  .ch-icon { font-size: 26px; }
  .ch-name {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
  }
  .ch-desc {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    line-height: 1.3;
  }
  .ch-play {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: #c41e3a;
    font-weight: 600;
    margin-top: 2px;
  }

  /* Загрузка */
  .loading {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    z-index: 10;
  }
  .loading.show { display: flex; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: #c41e3a;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: rgba(255,255,255,0.7); }

  /* Ошибка */
  .error-msg {
    display: none;
    background: rgba(196,30,58,0.15);
    border: 1px solid rgba(196,30,58,0.4);
    border-radius: 10px;
    padding: 12px;
    margin: 12px;
    font-size: 13px;
    text-align: center;
    color: #ff6b6b;
  }
  .error-msg.show { display: block; }
</style>
</head>
<body>

<div class="header">
  <div class="header-flag">🇹🇯</div>
  <div>
    <div class="header-title">Таджикское ТВ</div>
    <div class="header-sub">17 каналов онлайн</div>
  </div>
</div>

<!-- Плеер -->
<div id="player-section">
  <div style="position:relative;">
    <video id="video-player" controls autoplay playsinline></video>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text">Загрузка канала...</div>
    </div>
  </div>
  <div class="player-info">
    <div>
      <div class="player-name" id="player-name">—</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <span class="player-live">● LIVE</span>
      <button class="close-player" onclick="closePlayer()">✕ Закрыть</button>
    </div>
  </div>
</div>

<div class="error-msg" id="error-msg">
  ❌ Не удалось загрузить канал. Попробуйте другой канал или обновите страницу.
</div>

<!-- Каналы -->
<div class="channels-section">
  <div class="section-title">Все каналы</div>
  <div class="channels-grid" id="channels-grid"></div>
</div>

<script>
// Инициализация Telegram WebApp
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

// Каналы (stream обновляется через бота)
const CHANNELS = [
  { id: 112, name: "TVT 1",            icon: "📡", desc: "Главный государственный канал" },
  { id: 106, name: "Jahonnamo",         icon: "🌍", desc: "Информационный. Новости" },
  { id: 108, name: "Bakhoristan",       icon: "🌸", desc: "Детский и молодёжный" },
  { id: 110, name: "Safina",            icon: "⛵", desc: "Развлекательный канал" },
  { id: 397, name: "Синамо",            icon: "🎬", desc: "Таджикское кино" },
  { id: 495, name: "Таджикская Музыка", icon: "🎵", desc: "Музыка и клипы 24/7" },
  { id: 544, name: "Таджик фильмы",     icon: "🎥", desc: "Фильмы на таджикском" },
  { id: 583, name: "Футбол HD",         icon: "⚽", desc: "Спорт. Футбол в HD" },
  { id: 596, name: "Varzish",           icon: "🏆", desc: "Все виды спорта" },
  { id: 628, name: "Душанбе HD",        icon: "🏙", desc: "Городской канал" },
  { id: 629, name: "Шаҳнавоз",         icon: "🎭", desc: "Культура и традиции" },
  { id: 630, name: "ТВ-Хатлон",        icon: "🌿", desc: "Хатлонская область" },
  { id: 631, name: "ТВ-Бадахшон",      icon: "🏔", desc: "Бадахшан" },
  { id: 632, name: "ТВ-Кулоб",         icon: "🦁", desc: "Кулябский регион" },
  { id: 633, name: "Суғд",             icon: "🌾", desc: "Согдийская область" },
  { id: 673, name: "ТВ Сайёҳӣ",       icon: "✈️", desc: "Туризм и ремёсла" },
  { id: 694, name: "Илм ва табиат",    icon: "🔬", desc: "Наука и природа" },
];

let hls = null;
let currentId = null;

// Отрисовка карточек
function renderChannels() {
  const grid = document.getElementById('channels-grid');
  grid.innerHTML = CHANNELS.map(ch => `
    <div class="channel-card" id="card-${ch.id}" onclick="playChannel(${ch.id}, '${ch.name}')">
      <div class="ch-icon">${ch.icon}</div>
      <div class="ch-name">${ch.name}</div>
      <div class="ch-desc">${ch.desc}</div>
      <div class="ch-play">▶ Смотреть</div>
    </div>
  `).join('');
}

// Воспроизведение канала
async function playChannel(id, name) {
  // Убираем выделение предыдущего
  if (currentId) {
    document.getElementById(`card-${currentId}`)?.classList.remove('playing');
  }
  currentId = id;
  document.getElementById(`card-${id}`)?.classList.add('playing');

  // Показываем плеер и загрузку
  document.getElementById('player-section').classList.add('active');
  document.getElementById('player-name').textContent = name;
  document.getElementById('loading').classList.add('show');
  document.getElementById('error-msg').classList.remove('show');

  // Прокручиваем к плееру
  document.getElementById('player-section').scrollIntoView({ behavior: 'smooth' });

  try {
    // Получаем стрим через бота (передаём id в данных)
    const resp = await fetch(`https://khudoydod.github.io/tajik-tv/streams/${id}.json`);
    if (!resp.ok) throw new Error('No stream');
    const data = await resp.json();
    const streamUrl = data.stream;

    startPlayer(streamUrl);
  } catch(e) {
    // Если нет кэша — отправляем запрос боту
    tg.sendData(JSON.stringify({ action: 'get_stream', ch_id: id, ch_name: name }));
    document.getElementById('loading').classList.remove('show');
    document.getElementById('error-msg').classList.remove('show');
    document.getElementById('error-msg').textContent = `⏳ Запрашиваю ссылку для "${name}" у бота...`;
    document.getElementById('error-msg').classList.add('show');
  }
}

function startPlayer(url) {
  const video = document.getElementById('video-player');
  document.getElementById('loading').classList.remove('show');

  if (hls) { hls.destroy(); hls = null; }

  if (Hls.isSupported()) {
    hls = new Hls({ enableWorker: true, lowLatencyMode: true });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    hls.on(Hls.Events.ERROR, (e, data) => {
      if (data.fatal) {
        document.getElementById('error-msg').classList.add('show');
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.play();
  } else {
    document.getElementById('error-msg').classList.add('show');
  }
}

function closePlayer() {
  if (hls) { hls.destroy(); hls = null; }
  const video = document.getElementById('video-player');
  video.pause();
  video.src = '';
  document.getElementById('player-section').classList.remove('active');
  if (currentId) {
    document.getElementById(`card-${currentId}`)?.classList.remove('playing');
    currentId = null;
  }
}

// Получение стрима от бота
tg.onEvent('mainButtonClicked', () => {});

renderChannels();
</script>
</body>
</html>
