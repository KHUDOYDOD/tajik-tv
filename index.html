<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🇹🇯 Таджикское ТВ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07070d;--card:#10101a;--card-hover:#18182a;
  --red:#e53935;--red2:#ff5252;
  --text:#fff;--muted:rgba(255,255,255,.45);--border:rgba(255,255,255,.07);
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow-x:hidden}

/* ══ FULLSCREEN ══ */
#fs{
  display:none;
  position:fixed;top:0;left:0;
  width:100vw;height:100vh;
  background:#000;
  z-index:99999;
}
#fs.show{display:block}
#fs-v{width:100%;height:100%;object-fit:contain;background:#000;display:block}

/* Кнопка ✕ в углу */
#fs-x{
  position:fixed;top:14px;right:14px;
  width:44px;height:44px;
  background:rgba(0,0,0,.65);
  border:1.5px solid rgba(255,255,255,.18);
  border-radius:50%;
  color:#fff;font-size:20px;font-weight:300;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  z-index:100000;
  backdrop-filter:blur(12px);
  transition:background .18s,transform .18s;
  box-shadow:0 2px 16px rgba(0,0,0,.6);
}
#fs-x:hover{background:rgba(229,57,53,.85);transform:scale(1.08)}

/* Нижняя панель fullscreen */
#fs-bar{
  position:fixed;bottom:0;left:0;right:0;
  padding:18px 20px 24px;
  background:linear-gradient(transparent,rgba(0,0,0,.88));
  display:flex;align-items:center;justify-content:space-between;
  z-index:100000;
  transition:opacity .3s;
}
#fs-bar.hide{opacity:0;pointer-events:none}
#fs-name{font-size:17px;font-weight:700}
.live-badge{
  background:var(--red);color:#fff;
  font-size:10px;font-weight:700;
  padding:3px 9px;border-radius:4px;letter-spacing:.5px;
}

/* ══ HEADER ══ */
.hdr{
  background:linear-gradient(135deg,#c62828,#b71c1c);
  padding:14px 16px;
  display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 20px rgba(198,40,40,.4);
}
.hdr-icon{
  width:40px;height:40px;background:rgba(255,255,255,.15);
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
}
.hdr-title{font-size:17px;font-weight:700}
.hdr-sub{font-size:11px;opacity:.75;margin-top:1px}
.hdr-dot{
  margin-left:auto;display:flex;align-items:center;gap:5px;
  font-size:11px;font-weight:600;
  background:rgba(255,255,255,.15);
  padding:5px 10px;border-radius:20px;white-space:nowrap;
}
.hdr-dot::before{
  content:'';width:7px;height:7px;background:#69f0ae;border-radius:50%;
  animation:bl 1.2s infinite;
}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}

/* ══ INLINE PLAYER ══ */
#ps{display:none;background:#000;position:relative}
#ps.show{display:block}
#pv{width:100%;aspect-ratio:16/9;background:#000;display:block;cursor:pointer}

.pbar{
  background:linear-gradient(135deg,#180505,#100000);
  padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(229,57,53,.15);
}
.pname{font-size:15px;font-weight:600}
.pacts{display:flex;align-items:center;gap:8px}
.blv{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px}
.bfs{
  background:rgba(255,255,255,.1);border:none;color:#fff;
  font-size:13px;padding:5px 10px;border-radius:8px;cursor:pointer;
  transition:background .18s;
}
.bfs:hover{background:rgba(255,255,255,.22)}
.bcl{
  background:rgba(229,57,53,.18);border:none;color:var(--red2);
  font-size:13px;padding:5px 10px;border-radius:8px;cursor:pointer;
}

/* ══ LOADER ══ */
.ld{
  display:none;position:absolute;inset:0;
  background:rgba(0,0,0,.8);
  align-items:center;justify-content:center;
  flex-direction:column;gap:14px;z-index:5;
}
.ld.show{display:flex}
.sp{
  width:40px;height:40px;
  border:3px solid rgba(255,255,255,.15);
  border-top-color:var(--red);border-radius:50%;
  animation:sp .7s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* ══ ERROR ══ */
.er{
  display:none;margin:12px;
  background:rgba(229,57,53,.1);border:1px solid rgba(229,57,53,.3);
  border-radius:12px;padding:12px 14px;
  font-size:13px;color:#ff8a80;text-align:center;
}
.er.show{display:block}

/* ══ GRID ══ */
.sec{padding:14px 12px 0}
.sec-lbl{
  font-size:11px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:76px}

.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:18px;padding:16px 14px;
  cursor:pointer;
  transition:transform .15s,border-color .2s,background .2s;
  user-select:none;position:relative;overflow:hidden;
}
.card:active{transform:scale(.96)}
.card:hover{background:var(--card-hover)}
.card.on{border-color:var(--red);background:linear-gradient(135deg,#1a0505,#120000)}
.card.on::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--red),var(--red2));
}
.ci{font-size:30px;margin-bottom:10px}
.cn{font-size:13px;font-weight:700;line-height:1.3;margin-bottom:4px}
.cd{font-size:11px;color:var(--muted);line-height:1.4;margin-bottom:10px}
.cb{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--red2)}

/* ══ BOTTOM ══ */
.bot{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(7,7,13,.95);backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  padding:10px 16px 14px;
  display:flex;align-items:center;justify-content:space-between;z-index:50;
}
.bot-lnk{font-size:12px;color:var(--muted)}
.bm3u{
  background:linear-gradient(135deg,var(--red),#c62828);
  border:none;color:#fff;font-size:12px;font-weight:600;
  padding:8px 14px;border-radius:10px;cursor:pointer;
}
</style>
</head>
<body>

<!-- ══ FULLSCREEN ══ -->
<div id="fs">
  <video id="fs-v" controls autoplay playsinline></video>
  <button id="fs-x" onclick="closeFs()">✕</button>
  <div id="fs-bar">
    <div id="fs-name">—</div>
    <span class="live-badge">● LIVE</span>
  </div>
</div>

<!-- ══ HEADER ══ -->
<div class="hdr">
  <div class="hdr-icon">📺</div>
  <div>
    <div class="hdr-title">Таджикское ТВ</div>
    <div class="hdr-sub">17 каналов онлайн</div>
  </div>
  <div class="hdr-dot">LIVE</div>
</div>

<!-- ══ INLINE PLAYER ══ -->
<div id="ps">
  <div style="position:relative">
    <video id="pv" controls autoplay playsinline></video>
    <div class="ld" id="ld"><div class="sp"></div><span style="font-size:13px;color:rgba(255,255,255,.6)">Загрузка...</span></div>
  </div>
  <div class="pbar">
    <div class="pname" id="pn">—</div>
    <div class="pacts">
      <span class="blv">● LIVE</span>
      <button class="bfs" onclick="openFs()">⛶ Полный экран</button>
      <button class="bcl" onclick="closePlayer()">✕</button>
    </div>
  </div>
</div>

<div class="er" id="er"></div>

<!-- ══ GRID ══ -->
<div class="sec">
  <div class="sec-lbl">Все каналы — нажмите для просмотра</div>
  <div class="grid" id="grid"></div>
</div>

<!-- ══ BOTTOM ══ -->
<div class="bot">
  <span class="bot-lnk">@tajgrouptv_tj_bot</span>
  <button class="bm3u" onclick="dlM3U()">📥 M3U плейлист</button>
</div>

<script>
const tg=window.Telegram.WebApp;
tg.expand();tg.ready();

const API="https://kiro-taj.ru/tv";

const CHS=[
  {id:112,name:"TVT 1",         icon:"📡",desc:"Главный гос. канал"},
  {id:106,name:"Jahonnamo",     icon:"🌍",desc:"Новости · 3 языка"},
  {id:108,name:"Bakhoristan",   icon:"🌸",desc:"Детский канал"},
  {id:110,name:"Safina",        icon:"⛵",desc:"��азвлечения"},
  {id:397,name:"Синамо",        icon:"🎬",desc:"Таджикское кино"},
  {id:495,name:"ТВ Музыка",     icon:"🎵",desc:"Музыка 24/7"},
  {id:544,name:"Таджик фильмы", icon:"🎥",desc:"Фильмы"},
  {id:583,name:"Футбол HD",     icon:"⚽",desc:"Спорт · HD"},
  {id:596,name:"Varzish",       icon:"🏆",desc:"Все виды спорта"},
  {id:628,name:"Душанбе HD",    icon:"🏙",desc:"Городской канал"},
  {id:629,name:"Шаҳнавоз",     icon:"🎭",desc:"Культура"},
  {id:630,name:"ТВ-Хатлон",    icon:"🌿",desc:"Хатлонская обл."},
  {id:631,name:"ТВ-Бадахшон",  icon:"🏔",desc:"Бадахшан"},
  {id:632,name:"ТВ-Кулоб",     icon:"🦁",desc:"Кулоб"},
  {id:633,name:"Суғд",         icon:"🌾",desc:"Суғд"},
  {id:673,name:"ТВ Сайёҳӣ",   icon:"✈️",desc:"Туризм"},
  {id:694,name:"Илм ва табиат",icon:"🔬",desc:"Наука · Природа"},
];

let hls=null,fsHls=null,curId=null,curStream=null,curName=null;

function render(){
  document.getElementById('grid').innerHTML=CHS.map(c=>`
    <div class="card" id="c${c.id}" onclick="play(${c.id},'${c.name}')">
      <div class="ci">${c.icon}</div>
      <div class="cn">${c.name}</div>
      <div class="cd">${c.desc}</div>
      <div class="cb">▶ Смотреть</div>
    </div>`).join('');
}

async function play(id,name){
  if(curId) document.getElementById('c'+curId)?.classList.remove('on');
  curId=id;curName=name;
  document.getElementById('c'+id)?.classList.add('on');
  document.getElementById('pn').textContent=name;
  document.getElementById('ps').classList.add('show');
  document.getElementById('ld').classList.add('show');
  document.getElementById('er').classList.remove('show');
  document.getElementById('ps').scrollIntoView({behavior:'smooth'});
  try{
    const r=await fetch(`${API}/stream/${id}`);
    const d=await r.json();
    if(!d.ok) throw new Error(d.error);
    curStream=d.stream;
    loadHls(d.stream,document.getElementById('pv'),h=>{hls=h;});
  }catch(e){
    document.getElementById('ld').classList.remove('show');
    showErr('❌ Не удалось загрузить "'+name+'". Попробуйте другой канал.');
  }
}

function loadHls(url,vid,cb){
  document.getElementById('ld').classList.remove('show');
  if(Hls.isSupported()){
    const h=new Hls({enableWorker:true,lowLatencyMode:true,maxBufferLength:10});
    h.loadSource(url);h.attachMedia(vid);
    h.on(Hls.Events.MANIFEST_PARSED,()=>vid.play().catch(()=>{}));
    h.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)showErr('❌ Ошибка потока.');});
    cb(h);
  }else if(vid.canPlayType('application/vnd.apple.mpegurl')){
    vid.src=url;vid.play().catch(()=>{});cb(null);
  }else{showErr('❌ Браузер не поддерживает HLS.');}
}

function closePlayer(){
  if(hls){hls.destroy();hls=null;}
  const v=document.getElementById('pv');v.pause();v.src='';
  document.getElementById('ps').classList.remove('show');
  if(curId){document.getElementById('c'+curId)?.classList.remove('on');curId=null;}
}

// ПОЛНЫЙ ЭКРАН — CSS overlay на весь экран
function openFs(){
  if(!curStream||!curName) return;
  const fsV=document.getElementById('fs-v');
  document.getElementById('fs-name').textContent=curName;

  // Показываем overlay
  document.getElementById('fs').classList.add('show');
  document.body.style.overflow='hidden';

  // Останавливаем основной плеер
  document.getElementById('pv').pause();

  // Запускаем в fullscreen плеере
  if(fsHls){fsHls.destroy();fsHls=null;}
  if(Hls.isSupported()){
    fsHls=new Hls({enableWorker:true,lowLatencyMode:true,maxBufferLength:10});
    fsHls.loadSource(curStream);
    fsHls.attachMedia(fsV);
    fsHls.on(Hls.Events.MANIFEST_PARSED,()=>fsV.play().catch(()=>{}));
  }else if(fsV.canPlayType('application/vnd.apple.mpegurl')){
    fsV.src=curStream;fsV.play().catch(()=>{});
  }

  // Скрываем нижнюю панель через 3 сек
  const bar=document.getElementById('fs-bar');
  bar.classList.remove('hide');
  let t=setTimeout(()=>bar.classList.add('hide'),3000);
  fsV.onclick=()=>{
    bar.classList.toggle('hide');
    clearTimeout(t);
    if(!bar.classList.contains('hide'))
      t=setTimeout(()=>bar.classList.add('hide'),3000);
  };
}

function closeFs(){
  if(fsHls){fsHls.destroy();fsHls=null;}
  const fsV=document.getElementById('fs-v');
  fsV.pause();fsV.src='';
  document.getElementById('fs').classList.remove('show');
  document.body.style.overflow='';
  // Возобновляем основной
  if(curStream){
    document.getElementById('pv').play().catch(()=>{});
  }
}

// ESC
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeFs();});

async function dlM3U(){
  const btn=document.querySelector('.bm3u');
  btn.textContent='⏳ Генерирую...';btn.disabled=true;
  try{
    const lines=['#EXTM3U'];
    for(const ch of CHS){
      try{
        const r=await fetch(`${API}/stream/${ch.id}`);
        const d=await r.json();
        if(d.ok){
          lines.push(`#EXTINF:-1 tvg-id="${ch.id}" group-title="🇹🇯 Таджикистан",${ch.name}`);
          lines.push(d.stream);
        }
      }catch(e){}
    }
    const blob=new Blob([lines.join('\n')],{type:'application/x-mpegurl'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='tajikistan.m3u';a.click();
  }finally{btn.textContent='📥 M3U плейлист';btn.disabled=false;}
}

function showErr(msg){
  const e=document.getElementById('er');e.textContent=msg;e.classList.add('show');
}

render();
</script>
</body>
</html>
