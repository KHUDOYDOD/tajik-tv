<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🇹🇯 Таджикское ТВ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0a0a0f;
  --card: #13131a;
  --card2: #1a1a24;
  --accent: #e53935;
  --accent2: #ff5252;
  --text: #ffffff;
  --sub: rgba(255,255,255,0.5);
  --border: rgba(255,255,255,0.07);
}

html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow-x: hidden; }

/* HEADER */
.header {
  position: sticky; top: 0; z-index: 50;
  background: linear-gradient(135deg, #c62828, #b71c1c);
  padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  box-shadow: 0 2px 20px rgba(198,40,40,0.4);
}
.header-icon {
  width: 40px; height: 40px;
  background: rgba(255,255,255,0.15);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.header-title { font-size: 17px; font-weight: 700; }
.header-sub { font-size: 12px; opacity: 0.75; margin-top: 1px; }
.live-dot {
  margin-left: auto;
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600;
  background: rgba(255,255,255,0.15);
  padding: 5px 10px; border-radius: 20px;
}
.live-dot::before {
  content: '';
  width: 7px; height: 7px;
  background: #69f0ae;
  border-radius: 50%;
  animation: blink 1.2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* PLAYER */
#player-wrap {
  display: none;
  background: #000;
  position: relative;
}
#player-wrap.show { display: block; }
#video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }

.player-bar {
  background: linear-gradient(135deg, #1a0505, #120000);
  padding: 10px 14px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid rgba(229,57,53,0.2);
}
.player-ch { font-size: 15px; font-weight: 600; }
.player-right { display: flex; align-items: center; gap: 8px; }
.badge-live {
  background: var(--accent);
  color: #fff;
  font-size: 10px; font-weight: 700;
  padding: 3px 8px; border-radius: 4px;
  letter-spacing: 0.5px;
}
.btn-close {
  background: rgba(255,255,255,0.1);
  border: none; color: #fff;
  font-size: 12px; padding: 5px 10px;
  border-radius: 8px; cursor: pointer;
}

/* LOADER */
.loader-wrap {
  display: none;
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.85);
  align-items: center; justify-content: center;
  flex-direction: column; gap: 14px;
}
.loader-wrap.show { display: flex; }
.spin {
  width: 36px; height: 36px;
  border: 3px solid rgba(255,255,255,0.15);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ERROR */
.err-box {
  display: none;
  margin: 12px;
  background: rgba(229,57,53,0.1);
  border: 1px solid rgba(229,57,53,0.3);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 13px; color: #ff8a80;
  text-align: center;
}
.err-box.show { display: block; }

/* CHANNELS */
.section { padding: 14px 12px; }
.section-label {
  font-size: 11px; font-weight: 700;
  color: var(--sub);
  text-transform: uppercase; letter-spacing: 1.5px;
  margin-bottom: 12px;
}
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 12px;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s;
  user-select: none;
  position: relative;
  overflow: hidden;
}
.card:active { transform: scale(0.96); }
.card.active {
  border-color: var(--accent);
  background: linear-gradient(135deg, #1a0505, #130000);
}
.card.active::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
}
.card-icon { font-size: 28px; margin-bottom: 8px; }
.card-name { font-size: 13px; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
.card-desc { font-size: 11px; color: var(--sub); line-height: 1.4; margin-bottom: 8px; }
.card-btn {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 700;
  color: var(--accent2);
}

/* FOOTER */
.footer {
  padding: 16px;
  text-align: center;
  font-size: 11px;
  color: rgba(255,255,255,0.25);
  border-top: 1px solid var(--border);
}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">📺</div>
  <div>
    <div class="header-title">Таджикское ТВ</div>
    <div class="header-sub">17 каналов</div>
  </div>
  <div class="live-dot">LIVE</div>
</div>

<div id="player-wrap">
  <div style="position:relative">
    <video id="video" controls autoplay playsinline></video>
    <div class="loader-wrap" id="loader">
      <div class="spin"></div>
      <span style="font-size:13px;color:rgba(255,255,255,0.6)">Загрузка...</span>
    </div>
  </div>
  <div class="player-bar">
    <div class="player-ch" id="pname">—</div>
    <div class="player-right">
      <span class="badge-live">● LIVE</span>
      <button class="btn-close" onclick="closePlayer()">✕</button>
    </div>
  </div>
</div>

<div class="err-box" id="err"></div>

<div class="section">
  <div class="section-label">Все каналы</div>
  <div class="grid" id="grid"></div>
</div>

<div class="footer">@tajgrouptv_tj_bot • tajgroup.online</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

const API = "https://tajgroup.online/tv-api";

const CHS = [
  {id:112, name:"TVT 1",            icon:"📡", desc:"Главный гос. канал"},
  {id:106, name:"Jahonnamo",        icon:"🌍", desc:"Новости. 3 языка"},
  {id:108, name:"Bakhoristan",      icon:"🌸", desc:"Детский канал"},
  {id:110, name:"Safina",           icon:"⛵", desc:"Развлечения"},
  {id:397, name:"Синамо",           icon:"🎬", desc:"Таджикское кино"},
  {id:495, name:"ТВ Музыка",        icon:"🎵", desc:"Музыка 24/7"},
  {id:544, name:"Таджик фильмы",    icon:"🎥", desc:"Фильмы"},
  {id:583, name:"Футбол HD",        icon:"⚽", desc:"Спорт HD"},
  {id:596, name:"Varzish",          icon:"🏆", desc:"Все виды спорта"},
  {id:628, name:"Душанбе HD",       icon:"🏙", desc:"Городской канал"},
  {id:629, name:"Шаҳнавоз",        icon:"🎭", desc:"Культура"},
  {id:630, name:"ТВ-Хатлон",       icon:"🌿", desc:"Хатлон"},
  {id:631, name:"ТВ-Бадахшон",     icon:"🏔", desc:"Бадахшан"},
  {id:632, name:"ТВ-Кулоб",        icon:"🦁", desc:"Кулоб"},
  {id:633, name:"Суғд",            icon:"🌾", desc:"Суғд"},
  {id:673, name:"ТВ Сайёҳӣ",      icon:"✈️", desc:"Туризм"},
  {id:694, name:"Илм ва табиат",   icon:"🔬", desc:"Наука"},
];

let hls=null, curId=null;

function render(){
  document.getElementById('grid').innerHTML = CHS.map(c=>`
    <div class="card" id="c${c.id}" onclick="play(${c.id},'${c.name}')">
      <div class="card-icon">${c.icon}</div>
      <div class="card-name">${c.name}</div>
      <div class="card-desc">${c.desc}</div>
      <div class="card-btn">▶ Смотреть</div>
    </div>`).join('');
}

async function play(id, name){
  if(curId){ document.getElementById('c'+curId)?.classList.remove('active'); }
  curId=id;
  document.getElementById('c'+id)?.classList.add('active');
  document.getElementById('pname').textContent = name;
  document.getElementById('player-wrap').classList.add('show');
  document.getElementById('loader').classList.add('show');
  document.getElementById('err').classList.remove('show');
  document.getElementById('player-wrap').scrollIntoView({behavior:'smooth'});
  try {
    const r = await fetch(`${API}/stream/${id}`);
    const d = await r.json();
    if(!d.ok) throw new Error(d.error);
    startHls(d.stream);
  } catch(e){
    document.getElementById('loader').classList.remove('show');
    showErr('❌ Не удалось загрузить "'+name+'". Попробуйте другой канал.');
  }
}

function startHls(url){
  const v = document.getElementById('video');
  document.getElementById('loader').classList.remove('show');
  if(hls){ hls.destroy(); hls=null; }
  if(Hls.isSupported()){
    hls = new Hls({enableWorker:true, lowLatencyMode:true});
    hls.loadSource(url);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, ()=>v.play());
    hls.on(Hls.Events.ERROR, (e,d)=>{ if(d.fatal) showErr('❌ Ошибка потока. Попробуйте обновить.'); });
  } else if(v.canPlayType('application/vnd.apple.mpegurl')){
    v.src=url; v.play();
  } else { showErr('❌ Ваш браузер не поддерживает HLS.'); }
}

function closePlayer(){
  if(hls){hls.destroy();hls=null;}
  const v=document.getElementById('video');
  v.pause(); v.src='';
  document.getElementById('player-wrap').classList.remove('show');
  if(curId){ document.getElementById('c'+curId)?.classList.remove('active'); curId=null; }
}

function showErr(msg){
  const e=document.getElementById('err');
  e.textContent=msg; e.classList.add('show');
}

render();
</script>
</body>
</html>
